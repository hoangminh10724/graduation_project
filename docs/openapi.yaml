openapi: 3.1.0
info:
  title: WordSpeak Core API contract
  version: 0.1.0
  description: Hợp đồng giữa frontend, backend và ai-service. Sửa file này trước khi
    đổi API.
paths:
  /sessions/{session_id}:
    get:
      summary: Get Session
      operationId: get_session_sessions__session_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Session not found for the current user.
    patch:
      summary: Edit Session
      operationId: edit_session_sessions__session_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEdit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '409':
          description: Phiên đang xử lý một lượt Talk
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Session not found for the current user.
    delete:
      summary: Delete Session
      operationId: delete_session_sessions__session_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '409':
          description: Phiên đang xử lý một lượt Talk
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Session not found for the current user.
  /auth/forgot-password:
    post:
      summary: Forgot Password
      operationId: forgot_password_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEmail'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Request budget exceeded; Retry-After contains seconds to wait.
        '503':
          description: Email service is not configured.
  /auth/reset-password:
    post:
      summary: Reset Password
      operationId: reset_password_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          description: Token không hợp lệ, hết hạn hoặc đã dùng
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Request budget exceeded; Retry-After contains seconds to wait.
  /auth/verification/request:
    post:
      summary: Request Verification
      operationId: request_verification_auth_verification_request_post
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryAccepted'
        '429':
          description: Request budget exceeded; Retry-After contains seconds to wait.
        '503':
          description: Email service is not configured.
      security:
      - HTTPBearer: []
  /auth/verify-email:
    post:
      summary: Verify Email
      operationId: verify_email_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountToken'
        required: true
      responses:
        '204':
          description: Successful Response
        '400':
          description: Token không hợp lệ, hết hạn hoặc đã dùng
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Request budget exceeded; Retry-After contains seconds to wait.
  /requests/{request_id}:
    get:
      summary: Request Status
      operationId: request_status_requests__request_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestView'
        '404':
          description: Không tìm thấy request của người dùng
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /attempts:
    get:
      summary: List Attempts
      operationId: list_attempts_attempts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Before Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          title: Q
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /attempts/{attempt_id}:
    get:
      summary: Get Attempt
      operationId: get_attempt_attempts__attempt_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: attempt_id
        in: path
        required: true
        schema:
          type: integer
          title: Attempt Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetail'
        '404':
          description: Không tìm thấy lượt luyện thuộc người dùng
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Kiểm tra trạng thái dịch vụ (backend kiểm tra cả kết nối DB)
      responses:
        '200':
          description: OK
        '503':
          description: Backend không kết nối được DB
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
  /assess:
    post:
      summary: (ai-service) Chấm phát âm
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              - text
              properties:
                audio:
                  type: string
                  format: binary
                text:
                  type: string
      responses:
        '200':
          description: Điểm theo âm vị, từ, câu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
  /auth/register:
    post:
      summary: Register
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '409':
          description: Email đã đăng ký
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Thông tin đăng nhập không hợp lệ
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cards:
    post:
      summary: Create Card
      operationId: create_card_cards_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Cards
      operationId: list_cards_cards_get
      security:
      - HTTPBearer: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Q
      - name: deck_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Deck Id
      - name: suspended
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Suspended
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cards/due:
    get:
      summary: Due Cards
      operationId: due_cards_cards_due_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: deck_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Deck Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardView'
                title: Response Due Cards Cards Due Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reviews:
    post:
      summary: Review Card
      operationId: review_card_reviews_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '404':
          description: Không tìm thấy thẻ của người dùng hiện tại
        '409':
          description: Request ID reused with different input
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /transcribe:
    post:
      summary: (ai-service) Nhận dạng một lượt nói
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Transcript tiếng Anh
          content:
            application/json:
              schema:
                type: object
                required:
                - text
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 5000
  /sessions:
    post:
      summary: Create Session
      operationId: create_session_sessions_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Sessions
      operationId: list_sessions_sessions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Before Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /chat/stream:
    post:
      summary: Gửi một lượt Talk dạng văn bản
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: SSE gồm token, done hoặc error. Token và done có text, error
            có code.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Không tìm thấy phiên của người dùng hiện tại
        '409':
          description: Session is processing another turn, request_processing (Retry-After
            2 seconds), or request_conflict when an ID is reused with different input
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Required request_id UUID identifies one logical turn. Identical
        retries replay committed token/done/error events with replayed=true. Each
        event includes request_id. GET /requests/{request_id} retrieves status and
        persisted results. Never append replayed reply to partial text from the same
        request.
  /progress:
    get:
      summary: Get Progress
      operationId: get_progress_progress_get
      security:
      - HTTPBearer: []
      parameters:
      - name: timezone_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ws/audio:
    get:
      summary: (backend, WebSocket) Gửi audio, nhận chấm điểm và phản hồi Talk
      description: First send JSON {"type":"auth","token":"JWT"} within 10 seconds
        and wait for authenticated. Binary audio before authentication is rejected.
        Then send audio chunks up to 8 MiB per recording and finish with {"type":"end","request_id":"UUID","media_type":"audio/webm"}.
        A recording has a 120-second absolute deadline and 60-second idle timeout.
        Processing has a 180-second deadline. An optional token in end must match
        the authenticated connection. Tokens are revalidated per turn. Optional text
        supplies a reference sentence. Optional session_id enables Talk. partial acknowledges
        received_bytes; transcript supplies text and text_source (reference or stt).
        Supplied reference text skips STT; otherwise text comes from transcription.
        Talk emits token and done, assessment emits final with text, assessment and
        persisted attempt_id, followed by coaching when hints or errors exist. done
        may precede final. Errors include authentication_required, unauthorized, session_busy,
        rate_limited, assessment_unavailable and turn_expired. request_id is required
        for every turn and included on turn events. Reuse the same UUID and identical
        audio bytes, reference text, media_type and session_id when resending. Completed
        or failed requests replay persisted events with replayed=true without calling
        AI. A replayed done is preceded by a single token containing the full saved
        reply; replace partial UI content for that request before consuming the replay.
        request_processing means the request is still running; request_conflict means
        the ID was reused with different input. GET /requests/{request_id} returns
        durable state and committed events without uploading audio again. Interrupted
        requests are never executed again under the same ID. Failed requests may contain
        successfully committed Talk or assessment results.
      responses:
        '101':
          description: Switching Protocols
  /sessions/{session_id}/turns:
    get:
      summary: List Turns
      operationId: list_turns_sessions__session_id__turns_get
      security:
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Before Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Session not found for the current user.
