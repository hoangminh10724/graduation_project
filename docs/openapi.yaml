components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    HTTPBearer:
      type: http
      scheme: bearer
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
                maxLength: 255
              password:
                type: string
                minLength: 8
                description: Tối đa 72 byte UTF-8
  responses:
    Token:
      description: JWT có hiệu lực một giờ
      content:
        application/json:
          schema:
            type: object
            required:
            - access_token
            - token_type
            properties:
              access_token:
                type: string
              token_type:
                type: string
                enum:
                - bearer
  schemas:
    Card:
      type: object
      required:
      - id
      - front
      - back
      - due
      - stability
      - difficulty
      properties:
        id:
          type: integer
        front:
          type: string
        back:
          type: string
        due:
          type: string
          format: date-time
        stability:
          type: number
        difficulty:
          type: number
    Assessment:
      properties:
        sentence_score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Sentence Score
        words:
          items:
            $ref: '#/components/schemas/Word'
          type: array
          title: Words
        errors:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Errors
        hints:
          items:
            type: string
          type: array
          title: Hints
      type: object
      required:
      - sentence_score
      - words
      title: Assessment
    CardCreate:
      properties:
        front:
          type: string
          maxLength: 5000
          minLength: 1
          title: Front
        back:
          type: string
          maxLength: 5000
          minLength: 1
          title: Back
        deck_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deck Id
      type: object
      required:
      - front
      - back
      title: CardCreate
    CardEdit:
      properties:
        front:
          anyOf:
          - type: string
            maxLength: 5000
            minLength: 1
          - type: 'null'
          title: Front
        back:
          anyOf:
          - type: string
            maxLength: 5000
            minLength: 1
          - type: 'null'
          title: Back
        deck_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deck Id
        suspended:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Suspended
      type: object
      title: CardEdit
    CardPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CardView'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: CardPage
    CardView:
      properties:
        front:
          type: string
          maxLength: 5000
          minLength: 1
          title: Front
        back:
          type: string
          maxLength: 5000
          minLength: 1
          title: Back
        deck_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deck Id
        id:
          type: integer
          title: Id
        due:
          type: string
          format: date-time
          title: Due
        stability:
          type: number
          title: Stability
        difficulty:
          type: number
          title: Difficulty
        suspended:
          type: boolean
          title: Suspended
          default: false
      type: object
      required:
      - front
      - back
      - id
      - due
      - stability
      - difficulty
      title: CardView
    ChatRequest:
