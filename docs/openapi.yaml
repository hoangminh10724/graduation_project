openapi: 3.0.3
info:
  title: WordSpeak Core API contract
  version: 0.1.0
  description: Hợp đồng giữa frontend, backend và ai-service. Sửa file này trước khi
    đổi API.
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái dịch vụ (backend kiểm tra cả kết nối DB)
      responses:
        '200':
          description: OK
        '503':
          description: Backend không kết nối được DB
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
  /assess:
    post:
      summary: (ai-service) Chấm phát âm
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              - text
              properties:
                audio:
                  type: string
                  format: binary
                text:
                  type: string
      responses:
        '200':
          description: Điểm theo âm vị, từ, câu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
  /auth/register:
    post:
      summary: Đăng ký tài khoản và lấy JWT
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Token'
        '409':
          description: Email đã đăng ký
  /auth/login:
    post:
      summary: Đăng nhập và lấy JWT
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: Thông tin đăng nhập không hợp lệ
  /cards:
    post:
      summary: Tạo thẻ cho người dùng hiện tại
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - front
              - back
              properties:
                front:
                  type: string
                  minLength: 1
                  maxLength: 5000
                back:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '201':
          description: Thẻ vừa tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
  /cards/due:
    get:
      summary: (backend) Thẻ FSRS đến hạn
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Danh sách thẻ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
  /reviews:
    post:
      summary: (backend) Ghi đánh giá thẻ (rating 1-4)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - card_id
              - rating
              - request_id
              properties:
                card_id:
                  type: integer
                  minimum: 1
                rating:
                  type: integer
                  minimum: 1
                  maximum: 4
                request_id:
                  type: string
                  format: uuid
                  description: One UUID per learner review action. Reuse for retries.
      responses:
        '200':
          description: Lịch ôn kế tiếp
          content:
            application/json:
              schema:
                type: object
                required:
                - card
                - interval_days
                - interval_seconds
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
                  interval_days:
                    type: integer
                    minimum: 0
                  interval_seconds:
                    type: integer
                    minimum: 1
        '404':
          description: Không tìm thấy thẻ của người dùng hiện tại
        '409':
          description: Request ID reused with different input
  /transcribe:
    post:
      summary: (ai-service) Nhận dạng một lượt nói
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Transcript tiếng Anh
          content:
            application/json:
              schema:
                type: object
                required:
                - text
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 5000
  /sessions:
    post:
      summary: Tạo phiên Talk cho người dùng hiện tại
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                  maxLength: 120
                  default: ''
                cefr_level:
                  type: string
                  enum:
                  - A2
                  - B1
                  - B2
                  default: A2
      responses:
        '201':
          description: Phiên Talk vừa tạo
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - topic
                - cefr_level
                properties:
                  id:
                    type: integer
                  topic:
                    type: string
                  cefr_level:
                    type: string
                    enum:
                    - A2
                    - B1
                    - B2
    get:
      summary: Sessions owned by the current user
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sessions owned by the current user
  /chat/stream:
    post:
      summary: Gửi một lượt Talk dạng văn bản
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - text
              properties:
                session_id:
                  type: integer
                  minimum: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: SSE gồm token, done hoặc error. Token và done có text, error
            có code.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Không tìm thấy phiên của người dùng hiện tại
        '409':
          description: Session is processing another turn
  /progress:
    get:
      summary: Progress grouped by learner timezone and date
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Tiến độ người dùng hiện tại
          content:
            application/json:
              schema:
                type: object
                required:
                - attempts
                - streak_days
                - phoneme_averages
                properties:
                  attempts:
                    type: integer
                  streak_days:
                    type: integer
                  phoneme_averages:
                    type: object
                    additionalProperties:
                      type: number
                  timezone:
                    type: string
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        attempts:
                          type: integer
                        sentence_average:
                          type: number
                        phoneme_averages:
                          type: object
                          additionalProperties:
                            type: number
      parameters:
      - name: timezone_name
        in: query
        schema:
          type: string
          default: Asia/Ho_Chi_Minh
  /ws/audio:
    get:
      summary: (backend, WebSocket) Gửi audio, nhận chấm điểm và phản hồi Talk
      description: Send binary audio chunks up to 8 MiB, then JSON {"type":"end","token":"JWT","media_type":"audio/webm"}.
        audio/webm and audio/wav are supported. Optional text supplies the reference
        sentence. Optional session_id enables Talk. partial acknowledges received_bytes.
        transcript supplies recognized text. Talk emits token and done with text,
        while assessment runs concurrently. final contains text and assessment and
        may arrive after done. coaching contains errors and hints from AI service.
        Assessment failure emits error with code assessment_unavailable without cancelling
        Talk. Concurrent turns in the same session emit session_busy.
      responses:
        '101':
          description: Switching Protocols
  /sessions/{session_id}/turns:
    get:
      summary: Completed turns owned by the current user
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Completed turns owned by the current user
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: integer
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
                maxLength: 255
              password:
                type: string
                minLength: 8
                description: Tối đa 72 byte UTF-8
  responses:
    Token:
      description: JWT có hiệu lực một giờ
      content:
        application/json:
          schema:
            type: object
            required:
            - access_token
            - token_type
            properties:
              access_token:
                type: string
              token_type:
                type: string
                enum:
                - bearer
  schemas:
    Card:
      type: object
      required:
      - id
      - front
      - back
      - due
      - stability
      - difficulty
      properties:
        id:
          type: integer
        front:
          type: string
        back:
          type: string
        due:
          type: string
          format: date-time
        stability:
          type: number
        difficulty:
          type: number
    Assessment:
      type: object
      properties:
        sentence_score:
          type: number
          minimum: 0
          maximum: 100
        words:
          type: array
          items:
            type: object
            properties:
              word:
                type: string
              score:
                type: number
              phonemes:
                type: array
                items:
                  type: object
                  properties:
                    ipa:
                      type: string
                    score:
                      type: number
                    start:
                      type: number
                    end:
                      type: number
        hints:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
