    patch:
      summary: Edit Card
      operationId: edit_card_cards__card_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
          title: Card Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardEdit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
