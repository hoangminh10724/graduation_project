openapi: 3.1.0
info:
  title: WordSpeak Core API contract
  version: 0.1.0
  description: Hợp đồng giữa frontend, backend và ai-service. Sửa file này trước khi
    đổi API.
paths:
  /health:
    get:
      summary: Kiểm tra trạng thái dịch vụ (backend kiểm tra cả kết nối DB)
      responses:
        '200':
          description: OK
        '503':
          description: Backend không kết nối được DB
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
  /assess:
    post:
      summary: (ai-service) Chấm phát âm
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              - text
              properties:
                audio:
                  type: string
                  format: binary
                text:
                  type: string
      responses:
        '200':
          description: Điểm theo âm vị, từ, câu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assessment'
  /auth/register:
    post:
      summary: Đăng ký tài khoản và lấy JWT
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          $ref: '#/components/responses/Token'
        '409':
          description: Email đã đăng ký
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
  /auth/login:
    post:
      summary: Đăng nhập và lấy JWT
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Token'
        '401':
          description: Thông tin đăng nhập không hợp lệ
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
  /cards:
    post:
      summary: Create Card
      operationId: create_card_cards_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Cards
      operationId: list_cards_cards_get
      security:
      - HTTPBearer: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Q
      - name: deck_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Deck Id
      - name: suspended
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Suspended
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cards/due:
    get:
      summary: Due Cards
      operationId: due_cards_cards_due_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: deck_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Deck Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardView'
                title: Response Due Cards Cards Due Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reviews:
    post:
      summary: Review Card
      operationId: review_card_reviews_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '404':
          description: Không tìm thấy thẻ của người dùng hiện tại
        '409':
          description: Request ID reused with different input
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /transcribe:
    post:
      summary: (ai-service) Nhận dạng một lượt nói
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - audio
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Transcript tiếng Anh
          content:
            application/json:
              schema:
                type: object
                required:
                - text
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 5000
  /sessions:
    post:
      summary: Tạo phiên Talk cho người dùng hiện tại
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                  maxLength: 120
                  default: ''
                cefr_level:
                  type: string
                  enum:
                  - A2
                  - B1
                  - B2
                  default: A2
      responses:
        '201':
          description: Phiên Talk vừa tạo
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - topic
                - cefr_level
                properties:
                  id:
                    type: integer
                  topic:
                    type: string
                  cefr_level:
                    type: string
                    enum:
                    - A2
                    - B1
                    - B2
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
    get:
      summary: Sessions owned by the current user
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Sessions owned by the current user
  /chat/stream:
    post:
      summary: Gửi một lượt Talk dạng văn bản
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - text
              properties:
                session_id:
                  type: integer
                  minimum: 1
                text:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: SSE gồm token, done hoặc error. Token và done có text, error
            có code.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Không tìm thấy phiên của người dùng hiện tại
        '409':
          description: Session is processing another turn
        '429':
          description: Request budget exceeded. Retry-After contains seconds until
            the next window.
  /progress:
    get:
      summary: Progress grouped by learner timezone and date
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Tiến độ người dùng hiện tại
          content:
            application/json:
              schema:
                type: object
                required:
                - attempts
                - streak_days
                - phoneme_averages
                properties:
                  attempts:
                    type: integer
                  streak_days:
                    type: integer
                  phoneme_averages:
                    type: object
                    additionalProperties:
                      type: number
                  timezone:
                    type: string
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        attempts:
                          type: integer
                        sentence_average:
                          type: number
                        phoneme_averages:
                          type: object
                          additionalProperties:
                            type: number
      parameters:
      - name: timezone_name
        in: query
        schema:
          type: string
          default: Asia/Ho_Chi_Minh
  /ws/audio:
    get:
      summary: (backend, WebSocket) Gửi audio, nhận chấm điểm và phản hồi Talk
      description: First send JSON {"type":"auth","token":"JWT"} within 10 seconds
        and wait for authenticated. Binary audio before authentication is rejected.
        Then send audio chunks up to 8 MiB per recording and finish with {"type":"end","media_type":"audio/webm"}.
        A recording has a 120-second absolute deadline and 60-second idle timeout.
        Processing has a 180-second deadline. An optional token in end must match
        the authenticated connection. Tokens are revalidated per turn. Optional text
        supplies a reference sentence. Optional session_id enables Talk. partial acknowledges
        received_bytes; transcript supplies text. Talk emits token and done, assessment
        emits final with text and assessment, followed by coaching when hints or errors
        exist. done may precede final. Errors include authentication_required, unauthorized,
        session_busy, rate_limited, assessment_unavailable and turn_expired.
      responses:
        '101':
          description: Switching Protocols
  /sessions/{session_id}/turns:
    get:
      summary: Completed turns owned by the current user
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Completed turns owned by the current user
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: integer
  /cards/{card_id}:
    get:
      summary: Get Card
      operationId: get_card_cards__card_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
          title: Card Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Edit Card
      operationId: edit_card_cards__card_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
          title: Card Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardEdit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Card
      operationId: delete_card_cards__card_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
          title: Card Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cards/{card_id}/reviews:
    get:
      summary: Review History
      operationId: review_history_cards__card_id__reviews_get
      security:
      - HTTPBearer: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
          title: Card Id
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            exclusiveMinimum: 0
          - type: 'null'
          title: Before Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Review History Cards  Card Id  Reviews Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cards/{card_id}/schedule:
    get:
      summary: Preview Schedule
      operationId: preview_schedule_cards__card_id__schedule_get
      security:
      - HTTPBearer: []
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: integer
          title: Card Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Preview Schedule Cards  Card Id  Schedule Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /decks:
    post:
      summary: Create Deck
      operationId: create_deck_decks_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckInput'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Decks
      operationId: list_decks_decks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Decks Decks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /decks/{deck_id}:
    put:
      summary: Edit Deck
      operationId: edit_deck_decks__deck_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: integer
          title: Deck Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckView'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Deck
      operationId: delete_deck_decks__deck_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: integer
          title: Deck Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    HTTPBearer:
      type: http
      scheme: bearer
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - email
            - password
            properties:
              email:
                type: string
                format: email
                maxLength: 255
              password:
                type: string
                minLength: 8
                description: Tối đa 72 byte UTF-8
  responses:
    Token:
      description: JWT có hiệu lực một giờ
      content:
        application/json:
          schema:
            type: object
            required:
            - access_token
            - token_type
            properties:
              access_token:
                type: string
              token_type:
                type: string
                enum:
                - bearer
  schemas:
    Card:
      type: object
      required:
      - id
      - front
      - back
      - due
      - stability
      - difficulty
      properties:
        id:
          type: integer
        front:
          type: string
        back:
          type: string
        due:
          type: string
          format: date-time
        stability:
          type: number
        difficulty:
          type: number
    Assessment:
      type: object
      properties:
        sentence_score:
          type: number
          minimum: 0
          maximum: 100
        words:
          type: array
          items:
            type: object
            properties:
              word:
                type: string
              score:
                type: number
              phonemes:
                type: array
                items:
                  type: object
                  properties:
                    ipa:
                      type: string
                    score:
                      type: number
                    start:
                      type: number
                    end:
                      type: number
        hints:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    CardCreate:
      properties:
        front:
          type: string
          maxLength: 5000
          minLength: 1
          title: Front
        back:
          type: string
          maxLength: 5000
          minLength: 1
          title: Back
        deck_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deck Id
      type: object
      required:
      - front
      - back
      title: CardCreate
    CardEdit:
      properties:
        front:
          anyOf:
          - type: string
            maxLength: 5000
            minLength: 1
          - type: 'null'
          title: Front
        back:
          anyOf:
          - type: string
            maxLength: 5000
            minLength: 1
          - type: 'null'
          title: Back
        deck_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deck Id
        suspended:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Suspended
      type: object
      title: CardEdit
    CardPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CardView'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: CardPage
    CardView:
      properties:
        front:
          type: string
          maxLength: 5000
          minLength: 1
          title: Front
        back:
          type: string
          maxLength: 5000
          minLength: 1
          title: Back
        deck_id:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Deck Id
        id:
          type: integer
          title: Id
        due:
          type: string
          format: date-time
          title: Due
        stability:
          type: number
          title: Stability
        difficulty:
          type: number
          title: Difficulty
        suspended:
          type: boolean
          title: Suspended
          default: false
      type: object
      required:
      - front
      - back
      - id
      - due
      - stability
      - difficulty
      title: CardView
    ChatRequest:
      properties:
        session_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Session Id
        text:
          type: string
          maxLength: 5000
          minLength: 1
          title: Text
      type: object
      required:
      - session_id
      - text
      title: ChatRequest
    Credentials:
      properties:
        email:
          type: string
          maxLength: 255
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
      type: object
      required:
      - email
      - password
      title: Credentials
    DeckInput:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 1000
          title: Description
          default: ''
      type: object
      required:
      - name
      title: DeckInput
    DeckView:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 1000
          title: Description
          default: ''
        id:
          type: integer
          title: Id
      type: object
      required:
      - name
      - id
      title: DeckView
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProgressView:
      properties:
        attempts:
          type: integer
          title: Attempts
        streak_days:
          type: integer
          title: Streak Days
        phoneme_averages:
          additionalProperties:
            type: number
          type: object
          title: Phoneme Averages
        timezone:
          type: string
          title: Timezone
        daily:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Daily
      type: object
      required:
      - attempts
      - streak_days
      - phoneme_averages
      - timezone
      - daily
      title: ProgressView
    ReviewCreate:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        card_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Card Id
        rating:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Rating
      type: object
      required:
      - request_id
      - card_id
      - rating
      title: ReviewCreate
    ReviewResult:
      properties:
        card:
          $ref: '#/components/schemas/CardView'
        interval_days:
          type: integer
          title: Interval Days
        interval_seconds:
          type: integer
          title: Interval Seconds
      type: object
      required:
      - card
      - interval_days
      - interval_seconds
      title: ReviewResult
    SessionCreate:
      properties:
        topic:
          type: string
          maxLength: 120
          title: Topic
          default: ''
        cefr_level:
          type: string
          enum:
          - A2
          - B1
          - B2
          title: Cefr Level
          default: A2
      type: object
      title: SessionCreate
    SessionView:
      properties:
        topic:
          type: string
          maxLength: 120
          title: Topic
          default: ''
        cefr_level:
          type: string
          enum:
          - A2
          - B1
          - B2
          title: Cefr Level
          default: A2
        id:
          type: integer
          title: Id
      type: object
      required:
      - id
      title: SessionView
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: Token
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
